<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Xếp Hình</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <!-- Win Overlay -->
  <div id="win-banner">
    <div class="bg-white rounded-2xl shadow-2xl p-10 text-center">
      <div class="text-5xl font-extrabold text-green-500 mb-3">🎉 YOU WIN!</div>
      <div class="text-gray-500 text-lg mb-6">Chúc mừng bạn đã hoàn thành!</div>
      <button onclick="playAgain()"
        class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-xl text-lg transition">
        Chơi lại
      </button>
    </div>
  </div>

  <!-- Main Card -->
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-3xl">

    <!-- Start Button -->
    <div class="flex justify-center mb-6">
      <button id="btn-start"
        onclick="toggleGame()"
        class="bg-green-400 hover:bg-green-500 text-white font-bold py-2 px-8 rounded-lg text-base transition">
        Bắt đầu
      </button>
    </div>

    <div class="flex gap-6">
      <!-- Game Board -->
      <div id="board"
        class="grid grid-cols-4 gap-3 flex-1"
        style="max-width: 480px;">
        <!-- Tiles injected by JS -->
      </div>

      <!-- Right Panel -->
      <div class="flex flex-col gap-4" style="min-width:160px;">

        <!-- Clock -->
        <div class="bg-green-500 text-white rounded-xl p-4 text-center shadow">
          <div class="text-sm font-semibold mb-1">Đồng Hồ</div>
          <div id="clock" class="text-3xl font-mono font-bold tracking-widest">00:00</div>
        </div>

        <!-- Controls guide -->
        <div class="border border-gray-200 rounded-xl p-3 bg-gray-50">
          <div class="text-xs font-semibold text-gray-500 text-center mb-2">Hướng Dẫn Di Chuyển</div>
          <div class="flex flex-col items-center gap-1">
            <div class="flex justify-center">
              <span class="kbd-key">↑</span>
            </div>
            <div class="flex gap-1 justify-center">
              <span class="kbd-key">←</span>
              <span class="kbd-key">↓</span>
              <span class="kbd-key">→</span>
            </div>
            <div class="text-gray-300 text-xs my-1">──────</div>
            <div class="flex justify-center">
              <span class="kbd-key">W</span>
            </div>
            <div class="flex gap-1 justify-center">
              <span class="kbd-key">A</span>
              <span class="kbd-key">S</span>
              <span class="kbd-key">D</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- History Table -->
    <div class="mt-8">
      <div class="text-center font-semibold text-gray-700 mb-2">Lịch Sử Lượt Chơi</div>
      <table class="w-full border-collapse text-sm">
        <thead>
          <tr class="bg-gray-100 text-gray-600">
            <th class="border border-gray-200 py-2 px-3 text-left w-10">#</th>
            <th class="border border-gray-200 py-2 px-3 text-left">Bước đi</th>
            <th class="border border-gray-200 py-2 px-3 text-left">Thời Gian</th>
          </tr>
        </thead>
        <tbody id="history-body">
          <!-- Rows added by JS -->
        </tbody>
      </table>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
